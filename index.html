<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>M3U Player</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f0f0f0;
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
    }
    .container {
      display: flex;
      height: 100vh;
    }
    .playlist {
      width: 300px;
      background-color: #2c3e50;
      color: white;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    .playlist-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      border-bottom: 1px solid #34495e;
    }
    .playlist h2 {
      margin: 0;
    }
    .settings-btn {
      background-color: #3498db;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 5px 10px;
      cursor: pointer;
      font-size: 14px;
    }
    .settings-btn:hover {
      background-color: #2980b9;
    }
    .search-container {
      padding: 10px;
      border-bottom: 1px solid #34495e;
    }
    #search-input {
      width: 100%;
      padding: 8px;
      border: 1px solid #34495e;
      border-radius: 4px;
      background-color: #2c3e50;
      color: white;
      box-sizing: border-box;
      user-select: text;
      -webkit-user-select: text;
      -moz-user-select: text;
      -ms-user-select: text;
    }
    
    #m3u-url-input {
      user-select: text;
      -webkit-user-select: text;
      -moz-user-select: text;
      -ms-user-select: text;
    }
    #playlist-container {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }
    
    /* 自定义滚动条样式 */
    #playlist-container::-webkit-scrollbar {
      width: 8px;
    }
    
    #playlist-container::-webkit-scrollbar-track {
      background: #2c3e50;
      border-radius: 4px;
    }
    
    #playlist-container::-webkit-scrollbar-thumb {
      background: #3498db;
      border-radius: 4px;
    }
    
    #playlist-container::-webkit-scrollbar-thumb:hover {
      background: #2980b9;
    }
    
    /* 为Firefox添加滚动条样式 */
    #playlist-container {
      scrollbar-width: thin;
      scrollbar-color: #3498db #2c3e50;
    }
    .playlist-item {
      padding: 10px;
      margin: 5px 0;
      background-color: #34495e;
      cursor: pointer;
      border-radius: 4px;
      transition: background-color 0.2s;
    }
    .playlist-item:hover {
      background-color: #4a637a;
    }
    .playlist-item.active {
      background-color: #3498db;
    }
    .player-container {
      flex: 1;
      padding: 20px;
      display: flex;
      flex-direction: column;
    }
    .player {
      flex: 1;
      background-color: black;
      border-radius: 8px;
      overflow: hidden;
    }
    video {
      width: 100% !important;
      height: 100% !important;
    }
    .channel-info {
      margin-top: 10px;
      padding: 10px;
      background-color: white;
      border-radius: 4px;
    }
    
    .url-item {
      display: flex;
      align-items: center;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      background-color: #f9f9f9;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .url-item:hover {
      background-color: #e8f4f8;
      border-color: #3498db;
    }
    
    .url-item.active {
      background-color: #3498db;
      color: white;
      border-color: #2980b9;
    }
    
    .url-item-content {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
    }
    
    .url-item-actions {
      display: flex;
      gap: 5px;
      margin-left: 10px;
    }
    
    .url-item-actions button {
      padding: 4px 8px;
      font-size: 12px;
      border: none;
      border-radius: 3px;
      cursor: pointer;
    }
    
    .url-item-actions .delete-btn {
      background-color: #e74c3c;
      color: white;
    }
    
    .url-item-actions .delete-btn:hover {
      background-color: #c0392b;
    }
    
    .url-item.active .url-item-actions .delete-btn {
      background-color: #c0392b;
    }
    
    .url-item.active .url-item-actions .delete-btn:hover {
      background-color: #a93226;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="playlist">
      <div class="playlist-header">
        <h2>节目列表</h2>
        <button class="settings-btn" id="settings-btn">设置</button>
      </div>
      <div class="search-container">
        <input type="text" id="search-input" placeholder="搜索节目..." style="width: 100%; padding: 8px; border: 1px solid #34495e; border-radius: 4px; background-color: #2c3e50; color: white; margin-bottom: 10px;">
      </div>
      <div id="playlist-container"></div>
    </div>
    <div class="player-container">
      <div class="player">
        <video id="my-video" controls preload="auto" style="width: 100%; height: 100%; background: black;">
          <p>
            To view this video please enable JavaScript, and consider upgrading to a web browser that
            <a href="https://videojs.com/html5-video-support/" target="_blank">supports HTML5 video</a>
          </p>
        </video>
      </div>
      <div class="channel-info">
        <h3 id="channel-name">请选择一个频道</h3>
        <p id="channel-group"></p>
      </div>
    </div>
  </div>

  <!-- 加载框 -->
  <div id="loading-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.7); z-index: 2000; justify-content: center; align-items: center;">
    <div style="text-align: center; color: white;">
      <div style="width: 50px; height: 50px; margin: 0 auto 20px; border: 4px solid rgba(255,255,255,0.3); border-top: 4px solid #3498db; border-radius: 50%; animation: spin 1s linear infinite;"></div>
      <p style="font-size: 16px; margin: 0;">正在加载频道列表...</p>
    </div>
  </div>

  <!-- 设置弹窗 -->
  <div id="settings-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center;">
    <div style="background-color: white; padding: 20px; border-radius: 8px; width: 500px; max-height: 80vh; display: flex; flex-direction: column;">
      <h3 style="margin-top: 0;">M3U 链接管理</h3>
      
      <div style="margin: 15px 0;">
        <label for="m3u-url-input" style="display: block; margin-bottom: 5px;">添加新链接:</label>
        <div style="display: flex; gap: 10px;">
          <input type="text" id="m3u-url-input" style="flex: 1; padding: 8px; border: 1px solid #ddd; border-radius: 4px;" placeholder="输入M3U播放列表地址">
          <button id="add-url-btn" style="padding: 8px 16px; background-color: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer;">添加</button>
        </div>
      </div>
      
      <div style="flex: 1; overflow-y: auto; border: 1px solid #ddd; border-radius: 4px; margin-bottom: 15px; padding: 10px;">
        <div id="url-list" style="display: flex; flex-direction: column; gap: 8px;"></div>
      </div>
      
      <div style="display: flex; justify-content: flex-end; gap: 10px;">
        <button id="cancel-btn" style="padding: 8px 16px; border: 1px solid #ddd; border-radius: 4px; cursor: pointer;">取消</button>
        <button id="confirm-btn" style="padding: 8px 16px; background-color: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer;">确定</button>
      </div>
    </div>
  </div>

  <script src="./node_modules/hls.js/dist/hls.min.js"></script>
  <script src="./node_modules/flv.js/dist/flv.min.js"></script>
  <script src="./renderer.js"></script>
</body>
</html>
