<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M3U Player</title>
<style>
  :root {
    --bg: #0e1014;
    --panel: #16191f;
    --panel-2: #1c2028;
    --hover: #232833;
    --line: #262b35;
    --text: #e9ecf1;
    --text-dim: #8b93a1;
    --text-faint: #5c6472;
    --accent: #e5484d;
    --accent-dim: rgba(229, 72, 77, 0.12);
    --ok: #46c26e;
    --radius: 8px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    font-size: 13px;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  svg { display: block; }
  input, button { font-family: inherit; }

  #app { height: 100vh; display: flex; flex-direction: column; }

  /* ====== 顶栏 ====== */
  .topbar {
    height: 44px; flex: none;
    display: flex; align-items: center; gap: 12px;
    padding: 0 14px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  .logo {
    display: flex; align-items: center; gap: 8px;
    font-weight: 700; font-size: 13px; letter-spacing: 1px;
  }
  .logo-mark {
    width: 20px; height: 20px; border-radius: 5px;
    background: var(--accent);
    display: flex; align-items: center; justify-content: center;
  }
  .logo-mark svg { width: 11px; height: 11px; fill: #fff; }
  .source-pill {
    display: flex; align-items: center; gap: 6px;
    background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 14px; padding: 3px 10px;
    color: var(--text-dim); font-size: 12px;
    max-width: 220px; cursor: pointer;
  }
  .source-pill:hover { color: var(--text); }
  .source-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); flex: none; }
  .source-pill span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .topbar-spacer { flex: 1; }
  .icon-btn {
    width: 28px; height: 28px; border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-dim); cursor: pointer; flex: none;
    background: none; border: none;
  }
  .icon-btn:hover { background: var(--hover); color: var(--text); }
  .icon-btn svg { width: 16px; height: 16px; fill: currentColor; }

  /* ====== 主体两栏 ====== */
  .main { flex: 1; display: flex; min-height: 0; }

  /* ====== 左侧边栏 ====== */
  .sidebar {
    width: 272px; flex: none;
    background: var(--panel);
    border-right: 1px solid var(--line);
    display: flex; flex-direction: column;
    min-height: 0;
  }
  .search-box {
    margin: 10px; flex: none;
    display: flex; align-items: center; gap: 8px;
    background: var(--panel-2); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 0 10px; height: 32px;
  }
  .search-box:focus-within { border-color: var(--accent); }
  .search-box svg { width: 14px; height: 14px; fill: var(--text-faint); flex: none; }
  .search-box input {
    flex: 1; background: none; border: none; outline: none;
    color: var(--text); font-size: 13px;
    user-select: text; -webkit-user-select: text;
  }
  .search-box input::placeholder { color: var(--text-faint); }

  /* 分类：横向滑动，固定高度 */
  .cat-bar {
    flex: none;
    display: flex; gap: 6px;
    padding: 0 10px 10px;
    overflow-x: auto; overflow-y: hidden;
    scrollbar-width: none;
  }
  .cat-bar::-webkit-scrollbar { display: none; }
  .cat-chip {
    flex: none; height: 26px; padding: 0 12px;
    display: flex; align-items: center; gap: 5px;
    border-radius: 13px; border: 1px solid var(--line);
    background: var(--panel-2); color: var(--text-dim);
    font-size: 12px; cursor: pointer; white-space: nowrap;
    transition: background .15s, color .15s, border-color .15s;
  }
  .cat-chip:hover { color: var(--text); background: var(--hover); }
  .cat-chip.active {
    background: var(--accent-dim); border-color: var(--accent);
    color: var(--accent); font-weight: 600;
  }
  .cat-chip .count { font-size: 11px; color: var(--text-faint); }
  .cat-chip.active .count { color: var(--accent); opacity: .7; }

  .list-head {
    flex: none; display: flex; align-items: center; justify-content: space-between;
    padding: 4px 14px 6px;
    font-size: 11px; color: var(--text-faint); letter-spacing: 1px;
  }

  .ch-list { flex: 1; overflow-y: auto; padding: 0 6px 8px; }
  .ch-list::-webkit-scrollbar { width: 6px; }
  .ch-list::-webkit-scrollbar-thumb { background: #2b3140; border-radius: 3px; }
  .ch-list::-webkit-scrollbar-track { background: transparent; }
  .ch-list-empty {
    text-align: center; color: var(--text-faint);
    padding: 40px 20px; font-size: 12px;
  }
  .ch-item {
    display: flex; align-items: center; gap: 9px;
    height: 46px; padding: 0 8px 0 6px;
    border-radius: var(--radius); cursor: pointer;
    position: relative;
    transition: background .12s;
  }
  .ch-item:hover { background: var(--hover); }
  .ch-item.active { background: var(--accent-dim); }
  .ch-item.active::before {
    content: ""; position: absolute; left: 0; top: 10px; bottom: 10px;
    width: 3px; border-radius: 2px; background: var(--accent);
  }
  .ch-idx {
    width: 22px; flex: none; text-align: center;
    font-variant-numeric: tabular-nums;
    font-size: 11px; color: var(--text-faint);
  }
  .ch-item.active .ch-idx { color: var(--accent); font-weight: 700; }
  .ch-logo {
    width: 34px; height: 34px; flex: none; border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; color: #fff;
    overflow: hidden;
  }
  .ch-logo img { width: 100%; height: 100%; object-fit: contain; background: #fff; }
  .ch-meta { flex: 1; min-width: 0; }
  .ch-name {
    font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .ch-item.active .ch-name { color: var(--accent); font-weight: 600; }
  .ch-sub {
    font-size: 11px; color: var(--text-faint); margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .ch-state { flex: none; display: flex; align-items: center; gap: 5px; }
  .hd-badge {
    font-size: 10px; padding: 1px 5px; border-radius: 4px;
    background: var(--panel-2); border: 1px solid var(--line);
    color: var(--text-dim); font-weight: 600; letter-spacing: .5px;
  }
  .ch-item.failed { opacity: .45; }
  .ch-item.failed .ch-name { text-decoration: line-through; }
  .fail-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-faint); flex: none; }
  .live-dot {
    width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
    flex: none;
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{ opacity: 1 } 50%{ opacity: .35 } }

  /* ====== 右侧播放区 ====== */
  .player-col { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--bg); }
  .video-wrap {
    flex: 1; min-height: 0; position: relative;
    background: #000; margin: 12px; border-radius: 10px;
    overflow: hidden; border: 1px solid var(--line);
  }
  video#my-video {
    position: absolute; inset: 0;
    width: 100% !important; height: 100% !important;
    background: #000; object-fit: contain;
  }
  .video-standby {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    background:
      repeating-linear-gradient(0deg, transparent 0 23px, rgba(255,255,255,.015) 23px 24px),
      repeating-linear-gradient(90deg, transparent 0 23px, rgba(255,255,255,.015) 23px 24px),
      #0a0c0f;
    pointer-events: none;
  }
  .video-standby.hidden { display: none; }
  .standby-logo {
    width: 64px; height: 64px; border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 700; color: #fff;
  }
  .standby-name { font-size: 16px; font-weight: 600; }
  .standby-hint { font-size: 12px; color: var(--text-faint); letter-spacing: 2px; }
  .live-tag {
    position: absolute; top: 12px; left: 12px;
    display: flex; align-items: center; gap: 6px;
    background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.12);
    color: #fff; font-size: 11px; font-weight: 700; letter-spacing: 1px;
    padding: 3px 9px; border-radius: 5px;
    pointer-events: none;
  }
  .live-tag .live-dot { width: 6px; height: 6px; }

  /* OSD 控制条 */
  .osd {
    position: absolute; left: 0; right: 0; bottom: 0;
    height: 42px; background: #101318;
    border-top: 1px solid var(--line);
    display: flex; align-items: center; gap: 4px; padding: 0 10px;
    z-index: 10;
  }
  .osd .icon-btn { width: 30px; height: 30px; }
  .osd-time {
    margin-left: auto; font-variant-numeric: tabular-nums;
    font-size: 12px; color: var(--text-dim);
  }
  .osd-vol {
    width: 70px; height: 3px; border-radius: 2px;
    background: var(--panel-2); position: relative; margin: 0 10px 0 4px;
    cursor: pointer;
  }
  .osd-vol-fill {
    position: absolute; left: 0; top: 0; bottom: 0;
    background: var(--accent); border-radius: 2px;
  }
  .osd-vol-thumb {
    position: absolute; top: -3.5px; margin-left: -5px;
    width: 10px; height: 10px; border-radius: 50%; background: #fff;
  }

  /* 频道信息条 */
  .info-strip {
    flex: none; margin: 0 12px 12px; padding: 10px 14px;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius);
    display: flex; align-items: center; gap: 12px;
  }
  .info-ch { min-width: 0; flex: 1; display: flex; align-items: center; gap: 10px; }
  .info-logo {
    width: 38px; height: 38px; border-radius: 8px; flex: none;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; color: #fff; font-size: 13px;
    overflow: hidden;
  }
  .info-logo img { width: 100%; height: 100%; object-fit: contain; background: #fff; }
  .info-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .info-group { font-size: 12px; color: var(--text-dim); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat-chips { flex: none; display: flex; gap: 8px; }
  .stat-chip {
    display: flex; align-items: center; gap: 5px;
    font-size: 11px; color: var(--text-dim);
    background: var(--panel-2); border: 1px solid var(--line);
    padding: 3px 9px; border-radius: 12px;
    font-variant-numeric: tabular-nums;
  }
  .stat-chip b { color: var(--text); font-weight: 600; }

  /* 底部状态栏 */
  .statusbar {
    height: 26px; flex: none;
    display: flex; align-items: center; gap: 16px;
    padding: 0 14px; border-top: 1px solid var(--line);
    background: var(--panel);
    font-size: 11px; color: var(--text-faint);
    font-variant-numeric: tabular-nums;
  }
  .statusbar .sep { flex: 1; }

  /* ====== 弹窗通用 ====== */
  .modal-mask {
    position: fixed; inset: 0; z-index: 2000;
    background: rgba(4,6,10,.72);
    display: none; align-items: center; justify-content: center;
  }
  .modal-mask.open { display: flex; }
  .modal {
    width: 520px; max-width: calc(100vw - 40px);
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 18px;
    display: flex; flex-direction: column; gap: 14px;
    max-height: 80vh;
  }
  .modal-head { display: flex; align-items: center; justify-content: space-between; }
  .modal-head h3 { font-size: 15px; }
  .modal-scroll { overflow-y: auto; min-height: 0; }
  .modal-scroll::-webkit-scrollbar { width: 6px; }
  .modal-scroll::-webkit-scrollbar-thumb { background: #2b3140; border-radius: 3px; }
  .section-label {
    font-size: 11px; color: var(--text-faint); letter-spacing: 1px;
    margin-bottom: -6px;
  }
  .src-list { display: flex; flex-direction: column; gap: 6px; }
  .src-item {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 12px; border-radius: var(--radius);
    background: var(--panel-2); border: 1px solid var(--line);
    cursor: pointer; transition: border-color .15s, background .15s;
  }
  .src-item:hover { background: var(--hover); }
  .src-item.active { border-color: var(--accent); background: var(--accent-dim); }
  .src-radio {
    width: 14px; height: 14px; border-radius: 50%; flex: none;
    border: 2px solid var(--text-faint); position: relative;
  }
  .src-item.active .src-radio { border-color: var(--accent); }
  .src-item.active .src-radio::after {
    content: ""; position: absolute; inset: 2px; border-radius: 50%; background: var(--accent);
  }
  .src-url {
    flex: 1; font-size: 12px; color: var(--text-dim);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    direction: rtl; text-align: left;
    user-select: text; -webkit-user-select: text;
  }
  .src-item.active .src-url { color: var(--text); }
  .src-del {
    flex: none; width: 24px; height: 24px; border-radius: 5px;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-faint); cursor: pointer; background: none; border: none;
    font-size: 16px;
  }
  .src-del:hover { color: var(--accent); background: rgba(229,72,77,.12); }
  .add-row { display: flex; gap: 8px; }
  .add-row input {
    flex: 1; height: 34px; border-radius: var(--radius);
    background: var(--panel-2); border: 1px solid var(--line);
    color: var(--text); padding: 0 12px; outline: none; font-size: 13px;
    user-select: text; -webkit-user-select: text;
  }
  .add-row input:focus { border-color: var(--accent); }
  .btn {
    height: 34px; padding: 0 18px; border-radius: var(--radius);
    font-size: 13px; cursor: pointer; border: 1px solid var(--line);
    background: var(--panel-2); color: var(--text);
  }
  .btn:hover { background: var(--hover); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .btn.primary:hover { background: #d63c41; }
  .btn.primary:disabled { opacity: .5; cursor: default; }
  .modal-foot { display: flex; justify-content: flex-end; gap: 10px; }

  /* 更新区块 */
  .update-box {
    background: var(--panel-2); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 12px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .update-row { display: flex; align-items: center; gap: 10px; }
  .update-ver { font-size: 12px; color: var(--text-dim); flex: 1; }
  .update-ver b { color: var(--text); font-variant-numeric: tabular-nums; }
  .update-status { font-size: 12px; color: var(--text-faint); line-height: 1.5; }
  .update-status.ok { color: var(--ok); }
  .update-status.err { color: var(--accent); }
  .update-progress {
    height: 4px; border-radius: 2px; background: var(--line);
    overflow: hidden; display: none;
  }
  .update-progress.show { display: block; }
  .update-progress-bar {
    height: 100%; width: 0%; background: var(--accent);
    transition: width .3s;
  }

  /* 加载遮罩 */
  #loading-overlay {
    position: fixed; inset: 0; background: rgba(4,6,10,.72);
    z-index: 3000; display: none;
    flex-direction: column; gap: 16px;
    align-items: center; justify-content: center;
  }
  #loading-overlay.show { display: flex; }
  @keyframes spin { 0%{ transform: rotate(0deg) } 100%{ transform: rotate(360deg) } }
  .spinner {
    width: 44px; height: 44px;
    border: 3px solid var(--line); border-top-color: var(--accent);
    border-radius: 50%; animation: spin 1s linear infinite;
  }
  #loading-text { font-size: 13px; color: var(--text-dim); }

  /* Toast */
  #toast {
    position: fixed; left: 50%; bottom: 60px; transform: translateX(-50%);
    background: #000; border: 1px solid var(--line);
    color: var(--text); padding: 8px 18px; border-radius: 8px;
    font-size: 12px; z-index: 4000; display: none;
    max-width: 70vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #toast.show { display: block; }

  /* 响应式 */
  @media (max-width: 760px) {
    .sidebar { width: 220px; }
    .stat-chips { display: none; }
    .source-pill { max-width: 120px; }
    .statusbar { font-size: 10px; gap: 8px; }
  }
</style>
</head>
<body>
<div id="app">

  <!-- 顶栏 -->
  <div class="topbar">
    <div class="logo">
      <div class="logo-mark"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
      M3U PLAYER
    </div>
    <div class="source-pill" id="source-pill" title="点击管理源">
      <span class="dot"></span>
      <span id="source-pill-text">加载中…</span>
    </div>
    <div class="topbar-spacer"></div>
    <button class="icon-btn" id="refresh-btn" title="刷新列表">
      <svg viewBox="0 0 24 24"><path d="M17.65 6.35A8 8 0 1 0 20 12h-2a6 6 0 1 1-1.76-4.24L13 11h7V4z"/></svg>
    </button>
    <button class="icon-btn" id="settings-btn" title="设置">
      <svg viewBox="0 0 24 24"><path d="M19.14 12.94a7.14 7.14 0 0 0 0-1.88l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.61-.22l-2.39.96a7.3 7.3 0 0 0-1.62-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96a.5.5 0 0 0-.61.22L2.65 8.84a.5.5 0 0 0 .12.64l2.03 1.58a7.14 7.14 0 0 0 0 1.88L2.77 14.5a.5.5 0 0 0-.12.64l1.92 3.32c.13.23.4.32.61.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.04.24.25.42.5.42h3.84c.25 0 .46-.18.5-.42l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.1.48 0 .61-.22l1.92-3.32a.5.5 0 0 0-.12-.64zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/></svg>
    </button>
  </div>

  <!-- 主体 -->
  <div class="main">
    <div class="sidebar">
      <div class="search-box">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
        <input type="text" id="search-input" placeholder="搜索频道…">
      </div>
      <div class="cat-bar" id="cat-bar"></div>
      <div class="list-head">
        <span id="list-label">频道列表</span>
        <span id="list-count"></span>
      </div>
      <div class="ch-list" id="playlist-container"></div>
    </div>

    <div class="player-col">
      <div class="video-wrap">
        <video id="my-video" preload="auto"></video>
        <div class="video-standby" id="video-standby">
          <div class="standby-logo" id="standby-logo">TV</div>
          <div class="standby-name" id="standby-name">请选择一个频道</div>
          <div class="standby-hint" id="standby-hint">SELECT A CHANNEL</div>
        </div>
        <div class="live-tag" id="live-tag" style="display:none"><span class="live-dot"></span>LIVE</div>
        <div class="osd">
          <button class="icon-btn" id="osd-prev" title="上一频道 (↑)">
            <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
          </button>
          <button class="icon-btn" id="osd-next" title="下一频道 (↓)">
            <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>
          </button>
          <button class="icon-btn" id="osd-play" title="播放/暂停">
            <svg id="osd-play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          </button>
          <button class="icon-btn" id="osd-mute" title="静音">
            <svg id="osd-mute-icon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
          </button>
          <div class="osd-vol" id="osd-vol">
            <div class="osd-vol-fill" id="osd-vol-fill"></div>
            <div class="osd-vol-thumb" id="osd-vol-thumb"></div>
          </div>
          <div class="osd-time" id="osd-time">--:--:--</div>
          <button class="icon-btn" id="osd-full" title="全屏">
            <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
          </button>
        </div>
      </div>

      <div class="info-strip">
        <div class="info-ch">
          <div class="info-logo" id="info-logo">TV</div>
          <div style="min-width:0">
            <div class="info-title" id="channel-name">请选择一个频道</div>
            <div class="info-group" id="channel-group">在左侧列表中选择频道开始播放</div>
          </div>
        </div>
        <div class="stat-chips">
          <div class="stat-chip">频道 <b id="stat-total">0</b></div>
          <div class="stat-chip">失效 <b id="stat-failed" style="color:var(--accent)">0</b></div>
          <div class="stat-chip" id="stat-format-chip">格式 <b id="stat-format">-</b></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 状态栏 -->
  <div class="statusbar">
    <span id="status-source">当前源：-</span>
    <span class="sep"></span>
    <span id="status-decoder">hls.js / flv.js</span>
    <span id="status-clock">--</span>
  </div>
</div>

<!-- 设置弹窗：源管理 + 检查更新 -->
<div class="modal-mask" id="settings-modal">
  <div class="modal">
    <div class="modal-head">
      <h3>设置</h3>
      <button class="icon-btn" id="settings-close">
        <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      </button>
    </div>

    <div class="section-label">M3U 源管理</div>
    <div class="add-row">
      <input type="text" id="m3u-url-input" placeholder="输入 M3U 播放列表地址…">
      <button class="btn primary" id="add-url-btn">添加</button>
    </div>
    <div class="modal-scroll" style="max-height:180px">
      <div class="src-list" id="url-list"></div>
    </div>

    <div class="section-label">关于与更新</div>
    <div class="update-box">
      <div class="update-row">
        <div class="update-ver">当前版本 <b id="update-current-ver">-</b></div>
        <div class="update-ver" id="update-latest-ver" style="display:none">最新版本 <b id="update-latest-ver-num">-</b></div>
        <button class="btn primary" id="check-update-btn" style="height:30px;padding:0 14px">检查更新</button>
        <button class="btn primary" id="install-update-btn" style="height:30px;padding:0 14px;display:none">重启安装</button>
      </div>
      <div class="update-progress" id="update-progress"><div class="update-progress-bar" id="update-progress-bar"></div></div>
      <div class="update-status" id="update-status">连接 GitHub Release 检查新版本</div>
    </div>

    <div class="modal-foot">
      <button class="btn" id="cancel-btn">取消</button>
      <button class="btn primary" id="confirm-btn">应用所选源</button>
    </div>
  </div>
</div>

<!-- 加载遮罩 -->
<div id="loading-overlay">
  <div class="spinner"></div>
  <div id="loading-text">正在加载频道列表…</div>
</div>

<!-- Toast -->
<div id="toast"></div>

<script src="./node_modules/hls.js/dist/hls.min.js"></script>
<script src="./node_modules/flv.js/dist/flv.min.js"></script>
<script src="./renderer.js"></script>
</body>
</html>
